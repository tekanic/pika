<svg viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wmBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A57D"/>
      <stop offset="100%" stop-color="#9B7A55"/>
    </linearGradient>
    <linearGradient id="wmCrystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="wmText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <!-- Mini pika mascot on left -->
  <g transform="translate(50 50)">
    <!-- Ears -->
    <ellipse cx="-12" cy="-22" rx="8" ry="10" fill="url(#wmBody)" transform="rotate(-15 -12 -22)"/>
    <ellipse cx="12" cy="-22" rx="8" ry="10" fill="url(#wmBody)" transform="rotate(15 12 -22)"/>

    <!-- Body -->
    <circle cx="0" cy="0" r="30" fill="url(#wmBody)"/>

    <!-- Face -->
    <ellipse cx="0" cy="2" rx="20" ry="18" fill="#F5E6D0"/>

    <!-- Eyes -->
    <circle cx="-9" cy="-5" r="3.2" fill="#1F2937"/>
    <circle cx="9" cy="-5" r="3.2" fill="#1F2937"/>
    <circle cx="-8" cy="-6" r="1" fill="#FFFFFF"/>
    <circle cx="10" cy="-6" r="1" fill="#FFFFFF"/>

    <!-- Nose -->
    <ellipse cx="0" cy="4" rx="1.8" ry="1.3" fill="#3F2418"/>

    <!-- Mouth -->
    <path d="M 0 6 Q 0 10 -4 10" stroke="#3F2418" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 0 6 Q 0 10 4 10" stroke="#3F2418" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Tiny crystal -->
    <g transform="translate(20 18)">
      <path d="M -4 -5 L 4 -5 L 5 -1 L 4 5 L -4 5 L -5 -1 Z" fill="url(#wmCrystal)" stroke="#5B21B6" stroke-width="0.8" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="105" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="url(#wmText)" letter-spacing="-2">pika</text>

  <!-- Subtle dot above the i (reinforces the friendly, distinctive look) -->
  <circle cx="172" cy="32" r="3" fill="#A78BFA"/>
</svg>
